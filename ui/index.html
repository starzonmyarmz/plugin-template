<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Example</title>
<style>
  :root {
    --bg: #1b1a19;
    --panel: #262523;
    --ink: #f2efe8;
    --muted: #8f8b83;
    --accent: #ff7a3d;
    --track: #3a3835;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    block-size: 100%;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }

  body {
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", sans-serif;
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
  }

  main {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 28px;
    padding: 28px;
    border-radius: 16px;
    background: var(--panel);
  }

  .control {
    display: grid;
    justify-items: center;
    gap: 8px;
    inline-size: 72px;
  }

  .name {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .text {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .knob {
    --arc: calc(var(--turn) * 270deg);
    position: relative;
    inline-size: 56px;
    aspect-ratio: 1;
    border-radius: 50%;
    touch-action: none;
    cursor: ns-resize;
    background: conic-gradient(from -135deg, var(--accent) 0 var(--arc), var(--track) var(--arc) 270deg, transparent 270deg);
    mask: radial-gradient(circle, transparent 55%, #000 56%);
  }

  .dial {
    position: relative;
    inline-size: 56px;
    aspect-ratio: 1;

    & .pointer {
      position: absolute;
      inset: 0;
      rotate: calc(var(--turn) * 270deg - 135deg);
      pointer-events: none;

      &::before {
        content: "";
        position: absolute;
        inset-inline-start: calc(50% - 1px);
        inset-block-start: 16%;
        inline-size: 2px;
        block-size: 26%;
        border-radius: 1px;
        background: var(--ink);
      }
    }
  }

  .switch {
    inline-size: 44px;
    block-size: 24px;
    border-radius: 12px;
    background: var(--track);
    position: relative;
    cursor: pointer;
    transition: background 120ms;

    &::after {
      content: "";
      position: absolute;
      inset-block: 3px;
      inset-inline-start: 3px;
      inline-size: 18px;
      border-radius: 50%;
      background: var(--ink);
      transition: translate 120ms;
    }

    &[aria-checked="true"] {
      background: var(--accent);

      &::after { translate: 20px 0; }
    }
  }
</style>
</head>
<body>
<main id="controls"></main>

<script>
(() => {
  const params = new Map();
  const views = new Map();
  const dragging = new Set();

  const bridge = window.ipc
    ? (msg) => window.ipc.postMessage(JSON.stringify(msg))
    : mockBridge();

  function setParam(id, value) {
    const p = params.get(id);
    if (!p) return;
    p.value = Math.min(1, Math.max(0, value));
    bridge({ type: "set", id, value: p.value });
    views.get(id)?.(p);
  }

  function gesture(id, fn) {
    bridge({ type: "begin", id });
    fn();
    bridge({ type: "end", id });
  }

  // ---------- controls ----------

  function control(p, widget) {
    const el = document.createElement("div");
    el.className = "control";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = p.name;
    const text = document.createElement("span");
    text.className = "text";
    el.append(name, widget, text);
    return { el, text };
  }

  function buildKnob(p) {
    const id = p.id;
    const dial = document.createElement("div");
    dial.className = "dial";
    const knob = document.createElement("div");
    knob.className = "knob";
    knob.tabIndex = 0;
    knob.setAttribute("role", "slider");
    knob.setAttribute("aria-label", p.name);
    knob.setAttribute("aria-valuemin", "0");
    knob.setAttribute("aria-valuemax", "1");
    const pointer = document.createElement("div");
    pointer.className = "pointer";
    dial.append(knob, pointer);
    const { el, text } = control(p, dial);

    views.set(id, (p) => {
      dial.style.setProperty("--turn", p.value.toFixed(4));
      knob.setAttribute("aria-valuenow", p.value.toFixed(4));
      knob.setAttribute("aria-valuetext", p.text);
      text.textContent = p.text;
    });

    const stepped = p.steps > 0;
    const snap = (v) => stepped ? Math.round(v * p.steps) / p.steps : v;
    const stepSize = stepped ? 1 / p.steps : 0.01;

    knob.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      knob.setPointerCapture(e.pointerId);
      knob.focus();
      dragging.add(id);
      bridge({ type: "begin", id });
      let raw = p.value;
      let lastY = e.clientY;
      const move = (ev) => {
        const fine = ev.shiftKey ? 0.15 : 1;
        raw = Math.min(1, Math.max(0, raw + ((lastY - ev.clientY) / 200) * fine));
        lastY = ev.clientY;
        const next = snap(raw);
        if (next !== p.value) setParam(id, next);
      };
      const up = () => {
        knob.removeEventListener("pointermove", move);
        knob.removeEventListener("pointerup", up);
        knob.removeEventListener("pointercancel", up);
        dragging.delete(id);
        bridge({ type: "end", id });
      };
      knob.addEventListener("pointermove", move);
      knob.addEventListener("pointerup", up);
      knob.addEventListener("pointercancel", up);
    });

    knob.addEventListener("dblclick", () => gesture(id, () => setParam(id, p.default)));

    knob.addEventListener("keydown", (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (dir === undefined) return;
      e.preventDefault();
      e.stopPropagation();
      const amount = stepped ? stepSize : stepSize * (e.shiftKey ? 10 : 1);
      gesture(id, () => setParam(id, snap(p.value + dir * amount)));
    });

    knob.addEventListener("wheel", (e) => {
      e.preventDefault();
      const dir = Math.sign(-e.deltaY);
      if (!dir) return;
      gesture(id, () => setParam(id, snap(p.value + dir * (stepped ? stepSize : stepSize / 2))));
    }, { passive: false });

    return el;
  }

  function buildSwitch(p) {
    const id = p.id;
    const button = document.createElement("button");
    button.className = "switch";
    button.setAttribute("role", "switch");
    button.setAttribute("aria-label", p.name);
    const { el, text } = control(p, button);
    views.set(id, (p) => {
      button.setAttribute("aria-checked", String(p.value >= 0.5));
      text.textContent = p.text;
    });
    button.addEventListener("click", () => gesture(id, () => setParam(id, p.value >= 0.5 ? 0 : 1)));
    return el;
  }

  // Two-step parameters (bools and two-option enums) become switches,
  // everything else a knob. Replace this with a hand-laid page once the
  // plugin's controls settle.
  function build() {
    const root = document.getElementById("controls");
    root.replaceChildren(...[...params.values()].map((p) => p.steps === 1 ? buildSwitch(p) : buildKnob(p)));
    for (const p of params.values()) views.get(p.id)?.(p);
  }

  // ---------- messages ----------

  addEventListener("pointerdown", () => bridge({ type: "focus" }), true);
  addEventListener("focusin", () => bridge({ type: "keys", active: true }));
  addEventListener("focusout", (e) => {
    if (!e.relatedTarget) bridge({ type: "keys", active: false });
  });

  function forwardKey(msg) {
    const { event, type, ...init } = msg;
    const target = document.activeElement ?? document.body;
    target.dispatchEvent(new KeyboardEvent(event, { ...init, bubbles: true, cancelable: true }));
  }

  window.onPluginMessage = (msg) => {
    switch (msg.type) {
      case "key": return forwardKey(msg);
      case "init":
        params.clear();
        msg.params.forEach((p) => params.set(p.id, { ...p, value: p.default, text: "" }));
        build();
        return;
      case "values":
        for (const { id, value, text } of msg.values) {
          const p = params.get(id);
          if (!p) continue;
          p.text = text;
          if (!dragging.has(id)) p.value = value;
          views.get(id)?.(p);
        }
        return;
    }
  };

  // ---------- browser mock ----------

  // Mirrors the plugin's parameters so the page can be worked on in a
  // browser. Keep it in step with params when they change.
  function mockBridge() {
    const specs = [
      { id: "gain", name: "Gain", steps: 0, default: 0.5, text: (n) => `${(n * 60 - 30).toFixed(2)} dB` },
    ];
    const values = Object.fromEntries(specs.map((s) => [s.id, s.default]));
    const send = (msg) => setTimeout(() => window.onPluginMessage(msg));
    const sendValues = (ids) => send({
      type: "values",
      values: ids.map((id) => ({ id, value: values[id], text: specs.find((s) => s.id === id).text(values[id]) })),
    });
    return (msg) => {
      switch (msg.type) {
        case "ready":
          send({ type: "init", params: specs.map(({ text, ...rest }) => ({ options: [], ...rest })) });
          sendValues(specs.map((s) => s.id));
          return;
        case "set":
          values[msg.id] = msg.value;
          sendValues([msg.id]);
          return;
      }
    };
  }

  bridge({ type: "ready" });
})();
</script>
</body>
</html>
